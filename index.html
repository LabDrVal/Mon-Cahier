<style>
:root{
  --desk:#E9EEF5; --paper:#FDFEFF; --ink:#18233D; --muted:#5F6E88; --line:#D3DCE9;
  --blau:#2340B0; --blau-soft:#E3E8FA; --rule:#BCD0EC; --margin:#E07070;
  --masc:#2B67D1; --fem:#CF3F57; --ok:#23915A; --bad:#C2384F;
  --radius-s:8px; --radius-m:14px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:16px/1.5 "Instrument Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blau);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
#main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#main.fixed{overflow:hidden;display:flex;flex-direction:column}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 40px}

/* tabs */
#tabs{display:flex;justify-content:center;gap:4px;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px}
#tabs.hidden{display:none}
#tabs button{flex:0 1 110px;border:0;background:none;padding:6px 4px;border-radius:var(--radius-s);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-current="true"]{color:var(--blau);font-weight:600}

/* generic */
h1{font-size:30px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;margin:28px 0 10px;font-weight:600}
h3{font-size:17px;margin:0 0 6px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:var(--paper);padding:10px 16px;border-radius:999px;font-weight:500;min-height:44px}
.btn.primary{background:var(--blau);border-color:var(--blau);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.slim{padding:6px 12px;min-height:36px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 18px}
.panel+.panel{margin-top:12px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius-s);padding:10px 12px;font-size:16px}
textarea{min-height:120px;resize:vertical;line-height:1.6}
label.field{display:block;margin:14px 0 6px;font-weight:600}
a{color:var(--blau)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin:6px 0 16px}
.cal-head h1{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--paper);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekdays div{font-size:13px;color:var(--muted);text-align:center;padding-bottom:2px}
.day{position:relative;aspect-ratio:3/4;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-s);padding:0;overflow:hidden;text-align:left}
.day.empty{visibility:hidden}
.day .num{position:absolute;top:4px;left:6px;font-size:13px;font-weight:600;z-index:1;background:rgba(253,254,255,.85);border-radius:6px;padding:0 4px}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.day.today{border:2px solid var(--blau)}
.day.today .num{color:var(--blau)}
.day.future{opacity:.55}
.day .dot{position:absolute;bottom:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.cal-foot{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot.wait{background:var(--paper);border:2px solid var(--blau)}
.dot-inline{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);vertical-align:0}
.dot-inline.wait{background:transparent;border:2px solid var(--blau)}
.note{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--blau);border-radius:var(--radius-s);padding:12px 14px;margin:0 0 14px;font-size:15px}
.chips .chip{cursor:pointer}

/* page editor */
.pg-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;background:var(--desk)}
.pg-head .title{flex:1;text-align:center;font-weight:600;font-size:18px;line-height:1.2}
.pg-head .title small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:6px;align-items:center;padding:6px 12px 10px;flex-wrap:wrap;background:var(--desk);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--blau);color:#fff}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.size{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0}
.size i{display:block;border-radius:50%;background:var(--ink)}
.size[aria-pressed="true"]{border:2px solid var(--ink)}
.scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 30px}
.sheetwrap{max-width:900px;margin:0 auto;position:relative}
.sheetwrap canvas{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#paper{border:1px solid #C9D4E5;border-radius:4px;box-shadow:4px 4px 0 #D9E1EC}
#live{position:absolute;left:0;top:0;touch-action:none}
#main.fixed,#main.fixed *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.extend{display:block;margin:14px auto 0}

/* bottom sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(24,35,61,.32)}
#sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:86%;background:var(--desk);border-radius:18px 18px 0 0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:900px){#sheet .body{left:auto;top:0;bottom:0;max-height:none;width:min(560px,50vw);border-radius:0;animation:side .22s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@keyframes side{from{transform:translateX(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){#sheet .body{animation:none}}
.sheet-head{position:sticky;top:0;background:var(--desk);display:flex;align-items:center;gap:8px;padding:14px 18px 10px;border-bottom:1px solid var(--line);z-index:1}
.sheet-head h3{flex:1;margin:0;font-size:19px}
.sheet-content{padding:16px 18px}

/* analysis */
.sent{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin-top:12px}
.sent .de{font-size:19px;line-height:1.45}
.sent .orig{font-size:15px;color:var(--muted);margin-top:4px}
.sent .tr{font-size:15px;color:var(--muted);margin-top:6px;font-style:italic}
ins{text-decoration:none;background:#DDF2E6;color:#145C38;border-radius:4px;padding:0 2px}
del{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--bad)}
.mist{margin:10px 0 0;padding:0;list-style:none}
.mist li{padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.mist b{font-weight:600}
.gram{font-size:15px;margin-top:10px;padding:8px 10px;background:var(--blau-soft);border-radius:var(--radius-s)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:#fff}
.art{font-weight:700}
.art.m{color:var(--masc)} .art.f{color:var(--fem)} .art sup{font-size:.6em;font-weight:600;margin-left:1px}
.ok-badge{display:inline-block;font-size:13px;font-weight:600;color:var(--ok);margin-left:6px}
.lt li{font-size:15px}
.level-pill{display:inline-block;background:var(--blau);color:#fff;border-radius:999px;padding:2px 12px;font-weight:700}
.status{font-size:14px;color:var(--muted);min-height:20px;margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blau);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* log */
.tabs2{display:flex;gap:8px;margin:14px 0}
.letter{font-size:26px;font-weight:700;color:var(--blau);margin:22px 0 6px;border-bottom:2px solid var(--blau-soft)}
.item{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 14px;margin-top:6px}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.word-line{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.word-line .lemma{font-size:18px;font-weight:600}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.empty-state{text-align:center;padding:40px 10px;color:var(--muted)}
table.conj{border-collapse:collapse;width:100%;font-size:15px}
table.conj td{padding:4px 6px;border-bottom:1px solid var(--line)}
.conj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.conj-grid .panel{padding:10px 12px}

/* test */
.q{font-size:22px;line-height:1.4;margin:10px 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;font-size:18px;min-height:52px}
.opt.right{border-color:var(--ok);background:#E5F5EC}
.opt.wrong{border-color:var(--bad);background:#FBE7EA}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:36px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--blau)}
.bar .fill.low{background:#9AA9C9}
.bar.bar4{grid-template-columns:36px 1fr 40px 92px}
.bar.bar3w{grid-template-columns:96px 1fr 44px}
.progress{height:4px;background:var(--line);border-radius:2px;margin:10px 0 0;overflow:hidden}
.progress div{height:100%;background:var(--blau)}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--blau)}
.lv-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lv-badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.lv-badge.ok{border-color:var(--ok);color:var(--ok);background:#E5F5EC}
.lv-mini{display:inline-block;font-size:12px;font-weight:700;color:var(--blau);background:var(--blau-soft);border-radius:6px;padding:0 6px;margin-right:4px}
.topic{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius-s);padding:9px 12px;margin-top:6px}
.topic.gap{border-left-color:var(--bad)} .topic.review{border-left-color:#D9A021} .topic.solid{border-left-color:var(--ok)}
details summary{cursor:pointer;padding:6px 0}
.chip.pick{cursor:pointer;padding:6px 14px;font-size:15px}.chip.pick[aria-pressed="true"]{background:var(--blau);color:#fff;border-color:var(--blau)}
.seg button:disabled{opacity:.45}
.topic-btn{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}.topic-btn:disabled{cursor:default;opacity:.6}
.xp-pill{display:inline-block;font-size:13px;font-weight:700;color:#8A5A00;background:#FFEFC2;border-radius:999px;padding:2px 10px}
.ex-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:22px 20px;margin-top:18px;text-align:center}
.ex-big{font-size:30px;font-weight:700;line-height:1.25;margin:6px 0}
.ex-back{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.conj-line{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}
.conj-line .pron{font-size:22px;color:var(--muted)}
.conj-line input{width:min(340px,100%);font-size:24px;padding:10px 14px;text-align:center}
input.right{border-color:var(--ok);background:#E5F5EC} input.wrong{border-color:var(--bad);background:#FBE7EA}
.art-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}

<body>
<div id="app">
  <main id="main"></main>
  <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="sheet" aria-modal="true" role="dialog"><div class="scrim"></div><div class="body"></div></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDs = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ds(new Date());
const deLong = s => new Intl.DateTimeFormat("de-DE", {weekday: "long", day: "numeric", month: "long", year: "numeric"}).format(parseDs(s));
const deShort = s => new Intl.DateTimeFormat("de-DE", {day: "numeric", month: "short", year: "numeric"}).format(parseDs(s));
const frLong = s => new Intl.DateTimeFormat("fr-FR", {weekday: "long", day: "numeric", month: "long"}).format(parseDs(s));
const deCompare = (a, b) => String(a).localeCompare(String(b), "fr", {sensitivity: "base"});
const letterOf = s => { const c = String(s).trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms); }
// grammatical gender: "m" (le, un) or "f" (la, une)
function artClass(a) { a = (a || "").toLowerCase().trim(); return ["le", "un", "m", "masculin"].includes(a) ? "m" : ["la", "une", "f", "féminin", "feminin"].includes(a) ? "f" : ""; }
const startsVowel = w => /^[aeiouyàâäéèêëîïôöùûüœæh]/i.test(String(w || ""));
// article shown in front of a noun: le / la, or l' (with m/f) before a vowel
function artLabel(a, lemma) { const g = artClass(a); if (!g) return ""; return startsVowel(lemma) ? `l’<sup>${g}</sup>` : g === "m" ? "le" : "la"; }
function artHTML(a, lemma) { const g = artClass(a); return g ? `<span class="art ${g}">${artLabel(a, lemma)}</span> ` : ""; }
const artText = (a, lemma) => { const g = artClass(a); return g ? (startsVowel(lemma) ? "l’" : g === "m" ? "le " : "la ") : ""; };

/* ---------- storage (IndexedDB key/value) ---------- */
const STORE = "kv";
let _db;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open("cahier-francais", 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(mode, fn) {
  return idb().then(d => new Promise((res, rej) => {
    const t = d.transaction(STORE, mode); const st = t.objectStore(STORE);
    const req = fn(st); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
}
const dbGet = k => tx("readonly", st => st.get(k));
const dbSet = (k, v) => tx("readwrite", st => st.put(v, k));
const dbDel = k => tx("readwrite", st => st.delete(k));
async function dbPrefix(prefix) {
  const range = IDBKeyRange.bound(prefix, prefix + "\uffff");
  const [keys, vals] = await Promise.all([tx("readonly", st => st.getAllKeys(range)), tx("readonly", st => st.getAll(range))]);
  return keys.map((k, i) => [k, vals[i]]);
}
async function dbAll() {
  const [keys, vals] = await Promise.all([tx("readonly", st => st.getAllKeys()), tx("readonly", st => st.getAll())]);
  const o = {}; keys.forEach((k, i) => o[k] = vals[i]); return o;
}

/* ---------- app state ---------- */
const DEFAULT_SETTINGS = {key: "", model: "gemini-flash-latest", lang: "Deutsch", finger: false, goal: 50, target: "A1"};
const state = {view: "journal", month: new Date(), date: null, settings: {...DEFAULT_SETTINGS}, pageIndex: {}, logTab: "sentences", logQuery: "", test: null};
async function saveSettings() { await dbSet("settings", state.settings); }

/* ---------- AI: Gemini (free tier) ---------- */
function parseJSON(t) {
  t = String(t).replace(/```json|```/g, "").trim();
  try { return JSON.parse(t); } catch (e) {
    const a = t.indexOf("{"), b = t.lastIndexOf("}");
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e2) {} }
    throw new Error("Die Antwort der KI konnte nicht gelesen werden. Bitte noch einmal versuchen.");
  }
}
let onRetry = null;
async function gemini(parts) {
  const s = state.settings;
  if (!s.key) throw new Error("Trage zuerst deinen kostenlosen Gemini-Schlüssel in den Einstellungen ein.");
  const model = (s.model || "gemini-flash-latest").trim();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(s.key.trim())}`;
  const body = JSON.stringify({contents: [{role: "user", parts}], generationConfig: {responseMimeType: "application/json", temperature: 0.2}});
  let r, j;
  for (let attempt = 0; attempt < 4; attempt++) {
    try { r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body}); }
    catch (e) { throw new Error("Keine Verbindung zu Gemini. Prüfe deine Internetverbindung und versuche es noch einmal."); }
    j = await r.json().catch(() => ({}));
    if (![500, 502, 503, 504].includes(r.status)) break;
    if (attempt < 3) { if (onRetry) onRetry(attempt + 1); await sleep(2500 * (attempt + 1)); }
  }
  if (!r.ok) {
    if ([500, 502, 503, 504].includes(r.status)) throw new Error("Die kostenlosen Server von Google sind gerade überlastet. Versuche es in ein paar Minuten noch einmal oder stelle das Modell in den Einstellungen auf gemini-flash-lite-latest um, das meist weniger ausgelastet ist.");
    const m = j.error?.message || ("HTTP " + r.status);
    if (r.status === 429) throw new Error("Das kostenlose Gemini-Kontingent ist im Moment aufgebraucht. Warte eine Minute (oder bis morgen) und versuche es dann noch einmal.");
    if (r.status === 404) throw new Error(`Gemini kennt das Modell „${model}“ nicht. Ändere den Modellnamen in den Einstellungen.`);
    if (r.status === 400 && /key/i.test(m)) throw new Error("Gemini hat den Schlüssel abgelehnt. Prüfe ihn in den Einstellungen.");
    throw new Error("Gemini: " + m);
  }
  const text = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
  if (!text) throw new Error("Gemini hat keine Antwort geliefert" + (j.promptFeedback?.blockReason ? ` (${j.promptFeedback.blockReason})` : "") + ". Bitte noch einmal versuchen.");
  return parseJSON(text);
}

/* ---------- LanguageTool (free, no key) ---------- */
async function languageTool(text) {
  const r = await fetch("https://api.languagetool.org/v2/check", {method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"}, body: new URLSearchParams({text, language: "fr", motherTongue: "de-DE"})});
  if (!r.ok) throw new Error("LanguageTool ist gerade nicht erreichbar (" + r.status + ").");
  const j = await r.json();
  return (j.matches || []).map(m => ({msg: m.message, bad: text.substr(m.offset, m.length), fix: (m.replacements || []).slice(0, 3).map(x => x.value), cat: m.rule?.category?.name || ""}));
}

/* ---------- tabs ---------- */
const ICONS = {
  journal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="15" height="18" rx="2"/><path d="M8 8h7M8 12h7M8 16h4"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5h3M5 12h3M5 19h3"/><path d="M11 5h8M11 12h8M11 19h8"/></svg>',
  exercises: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>',
  daily: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5.2.2 1.7 1 2.7 2 3.2C11 9 11.5 6 12 3z"/></svg>',
  level: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V14M10 20V10M15 20V6M20 20V3"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
};
function renderTabs() {
  const tabs = [["journal", "Heft"], ["exercises", "Übungen"], ["daily", "Heute"], ["log", "Sammlung"], ["level", "Niveau"], ["settings", "Einstellungen"]];
  const nav = $("#tabs");
  const active = state.view === "page" ? "journal" : state.view;
  nav.classList.toggle("hidden", state.view === "page");
  nav.innerHTML = tabs.map(([id, label]) => `<button data-tab="${id}" aria-current="${id === active}">${ICONS[id]}<span>${label}</span></button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.tab));
}
async function go(view) {
  if (state.view === "page") await flushSave();
  state.view = view;
  render();
}
function render() {
  renderTabs();
  const main = $("#main");
  main.className = state.view === "page" ? "fixed" : "";
  main.scrollTop = 0;
  ({journal: renderJournal, page: renderPage, log: renderLog, level: renderLevel, settings: renderSettings, exercises: renderExercises, daily: renderDaily})[state.view]();
}

/* ---------- journal calendar ---------- */
const isWaiting = e => !!(e && e.thumb && e.updated && (!e.saved || (e.savedAt && e.updated > e.savedAt)));
const waitingDates = () => Object.keys(state.pageIndex).filter(d => isWaiting(state.pageIndex[d])).sort();
function daysSince(t) { return Math.floor((Date.now() - t) / 864e5); }
function renderJournal() {
  const m = state.month, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1), offset = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
  const title = new Intl.DateTimeFormat("de-DE", {month: "long", year: "numeric"}).format(first);
  const today = todayStr();
  let cells = "";
  for (let i = 0; i < offset; i++) cells += `<div class="day empty"></div>`;
  for (let d = 1; d <= days; d++) {
    const key = ds(new Date(y, mo, d)); const info = state.pageIndex[key];
    const cls = ["day"]; if (key === today) cls.push("today"); if (key > today) cls.push("future");
    const wait = isWaiting(info);
    const mark = wait ? '<span class="dot wait" title="Wartet auf Korrektur"></span>' : (info && info.saved ? '<span class="dot" title="Korrigiert und gespeichert"></span>' : "");
    cells += `<button class="${cls.join(" ")}" data-date="${key}" aria-label="${esc(deLong(key))}${info ? (wait ? ", wartet auf Korrektur" : ", korrigiert") : ""}">
      ${info && info.thumb ? `<img alt="" src="${info.thumb}">` : ""}<span class="num">${d}</span>${mark}</button>`;
  }
  const count = Object.keys(state.pageIndex).length;
  const waiting = waitingDates();
  let notes = "";
  if (!navigator.onLine) notes += `<div class="note"><b>Du bist offline.</b> Schreiben und deine Sammlung ansehen geht wie immer. Die Korrektur wartet, bis du wieder online bist.</div>`;
  if (count && !state.backupSnoozed && (!state.lastBackup || daysSince(state.lastBackup) >= 7)) {
    const d = state.lastBackup ? daysSince(state.lastBackup) : null;
    notes += `<div class="note"><span>${d === null ? "Du hast noch keine Sicherung gespeichert." : `Letzte Sicherung: vor ${d} Tagen.`} Eine Sicherung in iCloud Drive schützt dein Heft.</span>
      <div class="row" style="margin-top:8px"><button class="btn slim primary" id="bkNow">Jetzt sichern</button><button class="btn slim" id="bkLater">Später</button></div></div>`;
  }
  if (waiting.length) {
    notes += `<div class="note"><b>${waiting.length} Seite${waiting.length > 1 ? "n warten" : " wartet"} auf Korrektur</b>
      <div class="chips">${waiting.map(d => `<button class="chip" data-open="${d}">${esc(deShort(d))}</button>`).join("")}</div>
      <div class="row" style="margin-top:10px"><button class="btn slim primary" id="checkAll" ${navigator.onLine && state.settings.key ? "" : "disabled"}>Alle wartenden Seiten korrigieren</button>
      ${!state.settings.key ? '<span class="small muted">Trage zuerst deinen Gemini-Schlüssel in den Einstellungen ein.</span>' : (!navigator.onLine ? '<span class="small muted">Verfügbar, sobald du online bist.</span>' : "")}</div></div>`;
  }
  $("#main").innerHTML = `<div class="wrap">
    <div class="cal-head"><h1>${esc(title)}</h1>
      <button class="iconbtn" id="prevM" aria-label="Voriger Monat">‹</button>
      <button class="iconbtn" id="nextM" aria-label="Nächster Monat">›</button></div>
    <div id="goalBar" class="panel goal-bar"></div>
    ${notes}
    <div class="weekdays">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w => `<div>${w}</div>`).join("")}</div>
    <div class="grid">${cells}</div>
    <div class="cal-foot"><button class="btn primary" id="writeToday">Heutige Seite schreiben</button>
      <span class="muted small">${count ? `${count} Seite${count > 1 ? "n" : ""} geschrieben. <span class="dot-inline wait"></span> wartet auf Korrektur · <span class="dot-inline"></span> korrigiert und in der Sammlung gespeichert.` : "Tippe auf einen Tag, um seine Seite zu öffnen."}</span></div>
  </div>`;
  $("#prevM").onclick = () => { state.month = new Date(y, mo - 1, 1); renderJournal(); };
  $("#nextM").onclick = () => { state.month = new Date(y, mo + 1, 1); renderJournal(); };
  $("#writeToday").onclick = () => openPage(today);
  document.querySelectorAll(".day[data-date]").forEach(b => b.onclick = () => openPage(b.dataset.date));
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openPage(b.dataset.open));
  const bn = $("#bkNow"); if (bn) bn.onclick = async () => { bn.disabled = true; const ok = await doBackup(); if (ok) toast("Sicherung gespeichert"); renderJournal(); };
  const bl = $("#bkLater"); if (bl) bl.onclick = () => { state.backupSnoozed = true; renderJournal(); };
  const ca = $("#checkAll"); if (ca) ca.onclick = () => checkAllWaiting();
  fillGoalBar();
}
window.addEventListener("online", () => { if (state.view === "journal") renderJournal(); });
window.addEventListener("offline", () => { if (state.view === "journal") renderJournal(); });

/* ---------- handwriting page editor ---------- */
const PAGE_W = 1000, LINE = 46, TOP = 96, MARGIN_X = 88, MIN_H = 1400, MAX_H = 7000;
const PEN_COLORS = [["#2340B0", "Königsblau"], ["#1B1B1F", "Schwarz"], ["#C62F45", "Rot"], ["#1F8A55", "Grün"]];
const HL_COLOR = "#FFD84A";
const SIZES = [2.2, 3.4, 5];
const Ed = {date: null, strokes: [], height: MIN_H, undo: [], redo: [], tool: "pen", color: PEN_COLORS[0][0], size: SIZES[1],
  paper: null, live: null, scale: 1, dpr: 1, drawing: null, touchScroll: null, saveTimer: null, dirty: false, thumbDirty: false, lastPen: 0, raf: 0};

async function openPage(date) {
  if (state.view === "page") await flushSave();
  const p = (await dbGet("page:" + date)) || {strokes: [], height: MIN_H};
  Object.assign(Ed, {date, strokes: p.strokes || [], height: p.height || MIN_H, undo: [], redo: [], drawing: null, dirty: false});
  state.date = date; state.view = "page"; render();
}
function shiftDay(n) { const d = parseDs(Ed.date); d.setDate(d.getDate() + n); openPage(ds(d)); }

function renderPage() {
  const d = Ed.date;
  $("#main").innerHTML = `
    <div class="pg-head">
      <button class="btn slim" id="back">‹ Kalender</button>
      <button class="iconbtn" id="prevD" aria-label="Voriger Tag">‹</button>
      <div class="title">${esc(deLong(d))}<small>${esc(frLong(d))}</small></div>
      <button class="iconbtn" id="nextD" aria-label="Nächster Tag">›</button>
      <button class="btn primary slim" id="check">Seite korrigieren</button>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Schreibwerkzeuge">
      <div class="seg" id="tools">
        <button data-tool="pen" aria-pressed="${Ed.tool === "pen"}">Stift</button>
        <button data-tool="hl" aria-pressed="${Ed.tool === "hl"}">Marker</button>

${text}
"""`;

function naiveSentences(text) {

}

/* ---------- check all waiting pages ---------- */
async function checkOnePage(date, say) {
  const p = await dbGet("page:" + date);
  const img = p && pageImageBase64(p.strokes || []);
  if (!img) throw new Error("Diese Seite ist leer.");
  say("Handschrift wird gelesen…");

  const text = (tr.text || "").trim();

async function checkAllWaiting() {

  if (!state.settings.key) return toast("Trage zuerst deinen Gemini-Schlüssel in den Einstellungen ein.");
  const dates = waitingDates(); if (!dates.length) return;
  const run = {cancel: false};
  const box = openSheet(dates.length + " Seite" + (dates.length > 1 ? "n" : "") + " korrigieren", `

    <div id="batch">${dates.map(d => `<button class="item" data-d="${d}" disabled><b>${esc(deLong(d))}</b><div class="meta" id="b-${d}">Wartet</div></button>`).join("")}</div>

/* ---------- vocabulary progress (Lingvist-style) ---------- */
// Approximate number of words needed for each level (cumulative).
// Commonly cited estimates for French (there is no official word list like the Goethe-Institut's for German).
const VOCAB_TARGET = {A1: 650, A2: 1300, B1: 2400, B2: 4000, C1: 8000};
const TARGET_LEVELS = Object.keys(VOCAB_TARGET);
// Typical share of each word type in learner word lists (estimate).
const POS_GROUPS = {
  noun: {label: "Nomen", share: 0.50},
  verb: {label: "Verben", share: 0.22},
  adj: {label: "Adjektive & Adverbien", share: 0.20},
  other: {label: "Kleine Wörter", share: 0.08}
};
function posGroup(pos) {
  const p = String(pos || "").toLowerCase();
  if (/nomen|noun|substantiv|nom\b/.test(p)) return "noun";
  if (/verb/.test(p) && !/adverb/.test(p)) return "verb";
  if (/adjektiv|adjective|adjectif|adverb/.test(p)) return "adj";
  return "other";
}
const fmtN = n => new Intl.NumberFormat("de-DE").format(Math.round(n));
function nextTarget(n) { return TARGET_LEVELS.find(L => VOCAB_TARGET[L] > n) || null; }
function renderProgress(words) {
  const known = words.filter(w => w.own), seen = words.length - known.length, n = known.length;
  const next = nextTarget(n);
  let prev = 0;
  const ladder = TARGET_LEVELS.map(L => {
    const lo = prev, hi = VOCAB_TARGET[L]; prev = hi;
    const fill = Math.max(0, Math.min(1, (n - lo) / (hi - lo)));
    return `<div class="seg-l"><div class="seg-track"><div style="width:${fill * 100}%"></div></div><div class="seg-lab"><b>${L}</b><span>${fmtN(hi)}</span></div></div>`;
  }).join("");
  const goal = next || "C1", goalN = VOCAB_TARGET[goal];
  const typeCards = Object.entries(POS_GROUPS).map(([k, g]) => {
    const c = known.filter(w => w.group === k).length, t = Math.round(goalN * g.share);
    return `<button class="pcard" data-show-type="${k}"><div class="small muted">${g.label}</div><div class="pnum">${fmtN(c)}<span> / ~${fmtN(t)}</span></div>
      <div class="ptrack"><div style="width:${Math.min(100, c / t * 100)}%"></div></div></button>`;
  }).join("");
  const unsorted = known.filter(w => !w.cefr).length;
  let lo = 0;
  const byLevel = TARGET_LEVELS.map(L => {
    const need = VOCAB_TARGET[L] - lo; lo = VOCAB_TARGET[L];
    const c = known.filter(w => w.cefr === L).length;
    return `<button class="bar bar-lv" data-show-level="${L}"><b>${L}</b><div class="track"><div class="fill" style="width:${Math.min(100, c / need * 100)}%"></div></div><span>${fmtN(c)} / ~${fmtN(need)}</span></button>`;
  }).join("");
  const c2 = known.filter(w => w.cefr === "C2").length;
  let sortLine = "";
  if (unsorted) {
    if (!state.settings.key) sortLine = `${unsorted} ${unsorted > 1 ? "Wörter sind" : "Wort ist"} noch keinem Niveau zugeordnet. Trage deinen Gemini-Schlüssel in den Einstellungen ein, um sie einzuordnen.`;
    else if (!navigator.onLine) sortLine = `${unsorted} ${unsorted > 1 ? "Wörter werden" : "Wort wird"} eingeordnet, sobald du online bist.`;
    else if (state._sortFailed) sortLine = `Die Einordnung hat nicht geklappt: ${esc(state._sortFailed)} <button class="btn slim" id="retrySort">Noch einmal</button>`;
    else if (state._sortTried && known.filter(w => !w.cefr).every(w => state._sortTried.has(w.key))) sortLine = `${unsorted} ${unsorted > 1 ? "Wörter konnten" : "Wort konnte"} nicht eingeordnet werden.`;
    else sortLine = spinner(`${unsorted} ${unsorted > 1 ? "Wörter werden" : "Wort wird"} nach Niveau eingeordnet…`);
  }
  return `<div class="panel hero">
      <div class="hero-num">${fmtN(n)}</div>
      <div>${n === 1 ? "Wort kennst" : "Wörter kennst"} du: in deinem Heft benutzt oder in den Übungen gewusst${seen ? ` <span class="muted">· dazu ${fmtN(seen)} aus Korrekturen</span>` : ""}</div>
      <div class="ladder">${ladder}</div>
      <p style="margin:12px 0 0">${next ? `Nächstes Ziel: <b>${next}</b> bei etwa ${fmtN(VOCAB_TARGET[next])} Wörtern. Noch <b>${fmtN(VOCAB_TARGET[next] - n)}</b>.` : "Du hast die C1-Schätzung überschritten. Impressionnant !"}</p>
    </div>
    <h2>Nach Wortart <span class="small muted">(Ziel: ${goal})</span></h2>
    <div class="pgrid">${typeCards}</div>
    <h2>Nach Niveau des Wortes</h2>
    <p class="small muted">Wie viele Wörter jedes Niveaus du schon benutzt, verglichen mit ungefähr der Zahl neuer Wörter auf diesem Niveau.</p>
    <div class="panel bars">${byLevel}${c2 ? `<div class="small muted">Dazu ${fmtN(c2)} C2-${c2 > 1 ? "Wörter" : "Wort"}.</div>` : ""}</div>
    <div class="status" id="sortStatus">${sortLine}</div>
    <p class="small muted" style="margin-top:14px">Tippe auf eine Karte oder einen Balken, um die Wörter zu sehen. Als bekannt zählen Wörter, die du selbst geschrieben oder in den Übungen gewusst hast; Wörter, die nur in einer Korrektur vorkamen, stehen mit dem Hinweis „aus einer Korrektur“ in Wörter A–Z und zählen, sobald du sie selbst benutzt. Die Ziele sind Richtwerte: Für Französisch gibt es keine offiziellen Wortlisten wie beim Goethe-Institut; üblich genannte Schätzungen sind etwa 650 Wörter für A1, 1.300 für A2, 2.400 für B1, 4.000 für B2 und 8.000 für C1. Die Aufteilung nach Wortart ist eine Schätzung auf Basis typischer Lernwortschätze.</p>`;

async function maybeSortWords(words) {
  state._sortTried = state._sortTried || new Set();
  const todo = words.filter(w => !w.cefr && !state._sortTried.has(w.key));
  if (!todo.length || !state.settings.key || !navigator.onLine || state._sortFailed || state._sorting) return;
  state._sorting = true;
  try {
    const map = (await dbGet("cefr")) || {};
    for (let i = 0; i < todo.length; i += 80) {
      const batch = todo.slice(i, i + 80);
      batch.forEach(w => state._sortTried.add(w.key));
      const st = $("#sortStatus"); if (st && todo.length > 80) st.innerHTML = spinner(`Wörter werden eingeordnet… ${i} von ${todo.length}`);
      const r = await gemini([{text: `For each French word below, give the CEFR level at which learners normally learn it, based on the French reference descriptions (Niveau A1/A2/B1/B2 pour le français) and DELF practice: A1, A2, B1, B2, C1 or C2.
${batch.map((w, k) => `${k + 1}. ${w.lemma} (${w.pos || "?"})`).join("\n")}
Return only JSON: {"levels":["A1", ...]} with exactly ${batch.length} entries, in the same order.`}]);

      batch.forEach((w, k) => { const L = String(lv[k] || "").toUpperCase().trim(); if (LEVELS.includes(L)) map[w.key] = L; });
      await dbSet("cefr", map);
    }

    ${isVerb ? `<h3 style="margin-top:20px">Konjugation</h3><div id="conj"></div>` : ""}

    <div class="row"><button class="btn slim" id="moreEx">Weitere Beispielsätze</button></div><div id="ex"></div>`);

  const uk = $("#unknow", box); if (uk) uk.onclick = async () => { await unmarkKnown(w.key); closeSheet(); renderLog(); };
  if (isVerb) showConj(w.lemma, $("#conj", box));
  $("#moreEx", box).onclick = async () => {
    const ex = $("#ex", box); ex.innerHTML = `<p class="status"><span class="spin"></span>Beispiele werden geschrieben…</p>`;
    try {
      const r = await gemini([{text: `Give 4 short, natural French example sentences using "${w.lemma}" (${w.pos}), from easy to harder, each with a ${explLang()} translation. Return only JSON: {"examples":[{"de":"...","tr":"..."}]}`}]);
      ex.innerHTML = (r.examples || []).map(e => `<div class="sent"><div class="de">${esc(e.de)}</div><div class="tr">${esc(e.tr)}</div></div>`).join("");
    } catch (e) { ex.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  };
}
async function showConj(lemma, el) {
  const key = "conj:" + lemma.toLowerCase();
  const cached = await dbGet(key);
  const draw = c => {
    el.innerHTML = `<p class="small">${c.partizip2 ? `Participe passé: <b>${esc(c.partizip2)}</b> · ` : ""}Passé composé mit <b>${esc(c.auxiliary || "")}</b></p>
      <div class="conj-grid">${(c.tables || []).map(t => `<div class="panel"><h3>${esc(t.name)}</h3><table class="conj">${(t.forms || []).map(f => `<tr><td>${esc(f)}</td></tr>`).join("")}</table></div>`).join("")}</div>
      ${c.notes ? `<div class="gram">${esc(c.notes)}</div>` : ""}`;
  };
  if (cached) return draw(cached);
  el.innerHTML = `<button class="btn slim" id="loadConj">Alle Zeiten anzeigen</button>`;
  $("#loadConj", el).onclick = async () => {
    el.innerHTML = `<p class="status"><span class="spin"></span>Wird konjugiert…</p>`;
    try {
      const c = await gemini([{text: `Conjugate the French verb "${lemma}". ${FR_CONJ_RULES} Return only JSON: {"auxiliary":"avoir or être","partizip2":"participe passé","tables":${FR_CONJ_SHAPE},"notes":"one or two sentences in ${explLang()} on anything irregular about this verb"}`}]);
      await dbSet(key, c); draw(c);
    } catch (e) { el.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  };
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function prepQs(qs) { return qs.map(q => { const right = q.options[q.answer ?? 0]; const opts = shuffle(q.options); return {...q, options: opts, answer: opts.indexOf(right)}; }); }
function newRun(kind, qs, extra = {}) { return {kind, ...extra, i: 0, answers: [], flagged: [], qs: prepQs(qs), started: Date.now()}; }
async function persistRun() { const t = state.test; if (t && t.kind === "check") await dbSet("check:" + t.level, t); }
const pct = (c, n) => n ? Math.round(c / n * 100) : 0;
const spinner = msg => `<span class="spin"></span>${esc(msg)}`;

async function renderLevel() {
  const t = state.test;
  if (t && t.i < t.qs.length) return renderQuestion();
  const tests = (await dbGet("tests")) || [];
  const checks = (await dbGet("checks")) || {};
  const runs = {}; for (const L of CHECK_LEVELS) runs[L] = await dbGet("check:" + L);
  const logs = (await loadLogs()).filter(l => l.level).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);
  const last = tests[tests.length - 1];
  const hasKey = !!state.settings.key;
  const checkRow = L => {
    const res = (checks[L] || []).slice(-1)[0], run = runs[L];
    let status = run ? "" : "Noch nicht gemacht";
    if (res) status = res.validated ? `✓ Bestanden, ${res.pct} % · ${esc(deShort(res.date))}` : `Noch nicht bestanden, ${res.pct} % · ${esc(deShort(res.date))}`;
    const answered = run ? run.answers.length : 0;
    return `<div class="panel lv-row"><div class="lv-badge ${res && res.validated ? "ok" : ""}">${L}</div>
      <div style="flex:1;min-width:180px"><b>Niveau-Check ${L}</b><div class="small muted">${status}${run ? `${status ? " · " : ""}Begonnen: ${answered} von ${run.qs.length} beantwortet` : ""}</div></div>
      <div class="row">${run ? `<button class="btn slim primary" data-cont="${L}">Weiter</button>` : `<button class="btn slim ${res ? "" : "primary"}" data-start="${L}" ${hasKey ? "" : "disabled"}>${res ? "Wiederholen" : "Starten"}</button>`}
      ${res ? `<button class="btn slim" data-res="${L}">Ergebnis</button>` : ""}</div></div>`;
  };
  $("#main").innerHTML = `<div class="wrap"><h1>Niveau</h1>
    <div class="panel" style="margin-top:18px">
      ${last ? `<p>Einstufungstest: <span class="level-pill">${esc(last.est)}</span> <span class="muted small">(${esc(deShort(last.date))}, ${last.score}/${last.total})</span></p>` : `<p style="margin:0">Beginne mit dem Einstufungstest, um dein Niveau zu finden. Mit den Niveau-Checks siehst du dann genau, was dir noch fehlt.</p>`}
      ${logs.length ? `<p class="small" style="margin:8px 0 0">Deine letzten Heftseiten entsprechen etwa: ${logs.map(l => `<b>${esc(l.level)}</b> <span class="muted">(${esc(deShort(l.date))})</span>`).join(", ")}</p>` : ""}
    </div>

    <h2>Einstufungstest</h2>
    <p class="small muted">36 Fragen, 6 pro Niveau von A1 bis C2. Ein Niveau gilt als erreicht, wenn du mindestens 4 von 6 richtig hast, und die Niveaus darunter auch. Etwa 10 Minuten.</p>
    <div class="row"><button class="btn primary" id="tBuiltin">Standardtest starten</button>
      <button class="btn" id="tAI" ${hasKey ? "" : "disabled"}>Neuer KI-Test</button></div>
    <p class="small muted" style="margin-top:8px">${hasKey ? "Der Standardtest bleibt immer gleich, so kannst du deine Ergebnisse vergleichen. Der KI-Test hat jedes Mal neue Fragen." : "Mit einem Gemini-Schlüssel in den Einstellungen bekommst du KI-Tests und Niveau-Checks."}</p>
    <div id="tStatus" class="status"></div>

    <h2>Niveau-Checks</h2>
    <p class="small muted">Ein langer Test für ein Niveau: Grammatik, Konjugation und Wortschatz, die dieses Niveau verlangt, mit 3 Fragen pro Thema (insgesamt etwa 60). Du kannst jederzeit pausieren und später weitermachen. Am Ende siehst du, welche Themen sitzen, welche du wiederholen solltest und welche fehlen. Bestanden ist ein Niveau ab 70 % insgesamt und mindestens 60 % in jedem Teil.</p>
    ${CHECK_LEVELS.map(checkRow).join("")}
    <div id="cStatus" class="status"></div>

    ${tests.length ? `<h2>Bisherige Einstufungen</h2>${tests.slice().reverse().map(x => `<div class="item"><b>${esc(x.est)}</b> · ${x.score}/${x.total} <span class="meta">${esc(deShort(x.date))} · ${x.kind === "ai" ? "KI-Test" : "Standardtest"}</span></div>`).join("")}` : ""}
  </div>`;
  $("#tBuiltin").onclick = () => { state.test = newRun("placement", PLACEMENT, {source: "standard"}); renderLevel(); };
  $("#tAI").onclick = () => startAIPlacement();
  document.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startCheck(b.dataset.start));
  document.querySelectorAll("[data-cont]").forEach(b => b.onclick = async () => { const run = await dbGet("check:" + b.dataset.cont); run.i = run.answers.length; state.test = run; renderLevel(); });
  document.querySelectorAll("[data-res]").forEach(b => b.onclick = async () => { const c = (await dbGet("checks")) || {}; renderCheckResult(c[b.dataset.res].slice(-1)[0]); });
}

async function startAIPlacement() {
  const st = $("#tStatus"); if (!navigator.onLine) { st.textContent = "Du bist offline. Der Standardtest funktioniert auch offline."; return; }
  $("#tAI").disabled = true; st.innerHTML = spinner("Dein Test wird geschrieben…");

const foldAns = s => normAns(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe").replace(/æ/g, "ae");
// "allé(e)s" accepts allé, allée, allés, allées and the written-out form; "a/b" accepts either
function answerVariants(ans) {
  const out = new Set();
  for (const alt of String(ans || "").split(/\s*\/\s*/)) {
    let forms = [""];
    for (const part of alt.split(/(\([^)]*\))/)) {
      if (/^\(.*\)$/.test(part)) { const x = part.slice(1, -1); forms = forms.flatMap(f => [f, f + x]); }
      else forms = forms.map(f => f + part);
    }
    forms.forEach(f => out.add(normAns(f))); out.add(normAns(alt));
  }
  return out;
}

/* ---------- target level & level word lists ---------- */
const LIST_LEVELS = ["A1", "A2", "B1", "B2", "C1"];
const EXTRA_TOPICS = ["Häufige Verben", "Häufige Adjektive und Adverbien", "Kleine Wörter: Präpositionen, Konjunktionen, Fragewörter, Pronomen"];
const targetLevel = () => LIST_LEVELS.includes(state.settings.target) ? state.settings.target : "A1";
const levelTopics = L => [...SYLLABUS[L].Wortschatz, ...EXTRA_TOPICS];
const wkey = (lemma, pos) => String(lemma || "").trim().toLowerCase() + "|" + posKey(pos);
async function getLevelList(L) { return (await dbGet("lvl:" + L)) || {topics: {}}; }
function listWords(list) {
  const m = new Map();
  for (const [t, arr] of Object.entries(list.topics || {})) for (const w of arr || []) if (!m.has(w.key)) m.set(w.key, {...w, topic: t});
  return [...m.values()];
}
function listProgress(L, list) { const all = levelTopics(L), done = all.filter(t => list.topics && list.topics[t]).length; return {done, total: all.length, complete: done === all.length}; }

const POS_LIST = '"Nomen","Verb","Adjektiv","Adverb","Präposition","Konjunktion","Pronomen","Partikel","Andere"';
function pLevelTopic(L, topic) {
  const official = ["A1", "A2", "B1"].includes(L);
  return `You are building a French vocabulary list for German-speaking learners, CEFR level ${L}, topic "${topic}" (topic name in German).
${official ? `Follow the vocabulary of the French reference description "Niveau ${L} pour le français" and typical DELF ${L} vocabulary for this topic.` : `List the words learners typically need at ${L} for this topic (DELF ${L}).`}
${L === "A1" ? "" : `Only words that are NEW at ${L}: leave out basic words that belong to lower levels.`}
Give between 30 and 70 words, the most useful first. No proper names.
For each word:
- "lemma": dictionary form (infinitive, with "se"/"s'" for pronominal verbs; nouns in the singular without article; adjectives in the masculine singular)
- "pos": one of ${POS_LIST}
- "article": "le" for masculine or "la" for feminine nouns (also when the word elides to l'), otherwise null
- "plural": plural of nouns without article, or null
- "translation": short meaning in ${explLang()}
- "example": one short natural French sentence at level ${L} that uses the word
- "form": the word exactly as it is written in that example sentence (copy it character for character)
- "exampleTranslation": the example sentence in ${explLang()}
Return only JSON: {"words":[{"lemma":"...","pos":"...","article":null,"plural":null,"translation":"...","example":"...","form":"...","exampleTranslation":"..."}]}`;
}
function cleanListWords(arr, L) {
  const out = [];
  for (const w of arr || []) {
    if (!w || typeof w.lemma !== "string" || !w.lemma.trim()) continue;
    const pos = String(w.pos || "Andere"), art = String(w.article || "").toLowerCase();
    const e = {key: wkey(w.lemma, pos), lemma: w.lemma.trim(), pos, article: posGroup(pos) === "noun" && artClass(art) ? art : null,
      plural: w.plural || null, tr: String(w.translation || ""), level: L};
    if (typeof w.example === "string" && typeof w.form === "string" && w.form.trim() && w.example.includes(w.form.trim())) { e.ex = w.example.trim(); e.form = w.form.trim(); e.exTr = String(w.exampleTranslation || ""); }
    out.push(e);
  }
  return out;
}
async function prepareLevelList(L, say) {
  const list = await getLevelList(L);
  const todo = levelTopics(L).filter(t => !(list.topics && list.topics[t]));
  list.topics = list.topics || {}; list.lang = state.settings.lang;
  let k = 0;
  for (const t of todo) {
    k++; say(`Wortliste ${L} wird vorbereitet: ${t} (${k} von ${todo.length})…`);
    onRetry = n => say(`Google ist ausgelastet, neuer Versuch (${n} von 3)…`);
    const r = await gemini([{text: pLevelTopic(L, t)}]);
    const words = cleanListWords(r.words, L);
    if (words.length < 5) throw new Error(`Das Thema „${t}“ ist leer zurückgekommen. Tippe noch einmal, um dort weiterzumachen.`);
    list.topics[t] = words; list.updated = Date.now();
    await dbSet("lvl:" + L, list);
    if (k < todo.length) await sleep(1200);
  }
  onRetry = null;
  return list;
}

/* words marked as known in exercises (they count like journal words) */
async function getKnown() { return (await dbGet("known")) || {}; }
async function markKnown(w) {
  const k = await getKnown(); if (k[w.key]) return false;
  k[w.key] = {lemma: w.lemma, pos: w.pos, article: w.article || null, plural: w.plural || null, translation: w.translation || w.tr || "", level: w.level || null, date: todayStr()};
  await dbSet("known", k); return true;
}
async function unmarkKnown(key) { const k = await getKnown(); delete k[key]; await dbSet("known", k); }
async function allWords(logs) {
  const words = buildWords(logs), known = await getKnown();
  const m = new Map(words.map(w => [w.key, w]));
  for (const [key, v] of Object.entries(known)) {
    const w = m.get(key);
    if (w) { if (!w.own) { w.own = true; w.knownEx = true; } if (!w.cefr && v.level) w.cefr = v.level; }
    else { const n = {key, lemma: v.lemma, pos: v.pos, article: v.article, plural: v.plural, translation: v.translation, forms: new Map(), refs: [], uses: 0, own: true, fromList: true, cefr: v.level || null}; words.push(n); m.set(key, n); }
  }
  return words;
}
// Match words by their dictionary form only, ignoring "se"/"s'", articles and how the word type was labelled
const normLemma = l => String(l || "").toLowerCase().replace(/[’`]/g, "'").replace(/^\(?(se|s')\)?\s*|^(le|la|les|un|une)\s+|^l'\s*/g, "").replace(/[.,!?;:]/g, "").replace(/\s+/g, " ").trim();
async function levelIndex() {
  const idx = new Map();
  for (const L of LIST_LEVELS) for (const w of listWords(await getLevelList(L))) { const k = normLemma(w.lemma); if (!idx.has(k)) idx.set(k, L); }
  return idx;
}
// Gives every word one level: the level list it appears in wins; otherwise the level Gemini sorted it into
async function assignLevels(words) {
  const idx = await levelIndex(), cefrMap = (await dbGet("cefr")) || {};
  for (const w of words) {
    const inList = idx.get(normLemma(w.lemma));
    w.inList = !!inList;
    w.cefr = inList || w.cefr || cefrMap[w.key] || null;
    w.group = posGroup(w.pos);
  }
  return words;
}
async function levelStats(L) {
  const list = await getLevelList(L), lw = listWords(list);
  const words = await assignLevels(await allWords(await loadLogs()));
  const ownWords = words.filter(w => w.own);
  const own = new Set(ownWords.map(w => w.key));
  const ownNorm = new Set(ownWords.map(w => normLemma(w.lemma)));
  const knownL = ownWords.filter(w => w.cefr === L);                 // every known word of this level
  const extra = knownL.filter(w => !w.inList).length;                // known level words the list doesn't contain
  const listKnown = lw.filter(w => ownNorm.has(normLemma(w.lemma))).length;
  return {list, lw, known: knownL.length, total: lw.length + extra, listKnown, extra, prog: listProgress(L, list), own, ownNorm};
}

async function loadVocab(source) {
  const logs = await loadLogs(), words = await allWords(logs);
  const srs = (await dbGet("srs")) || {}, today = todayStr();

}
// fill-in-the-sentence items: from the level list's example sentences, or from your own corrected sentences
function clozeFromLog(words) {

  for (const w of words) for (const r of w.refs || []) {

}

      <label class="field">Wie</label>
      <div class="seg" id="cMode"><button data-m="single" aria-pressed="${cfg.mode === "single"}">Eine Person</button><button data-m="table" aria-pressed="${cfg.mode === "table"}">Die ganze Tabelle</button></div>
      <p class="small muted" style="margin:6px 0 0">${cfg.mode === "table" ? "Du schreibst alle sechs Personen (je, tu, il/elle/on, nous, vous, ils/elles) eines Verbs in einer Zeit. 4 Tabellen pro Runde." : "Du siehst ein Verb, eine Zeit und eine Person und schreibst diese eine Form. 10 Formen pro Runde."}</p>
      <label class="field">Zeiten</label>
      <div class="chips" id="cTen">${DRILL_TENSES.map(t => `<button class="chip pick" aria-pressed="${cfg.tenses.includes(t)}" data-t="${t}">${t}</button>`).join("")}</div>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="cGo">Starten</button></div>
      <div class="status" id="cStat"></div>
      <p class="small muted" style="margin-top:8px">${online ? "Verben ohne Tabelle konjugiert Gemini beim Start einer Runde; danach sind sie auch offline verfügbar." : `Offline: Es werden die ${ready(cfg.source)} Verben benutzt, deren Tabellen schon auf diesem iPad sind.`} ${CORE_VERBS.length} häufige Verben sind schon eingebaut (ohne Subjonctif).</p>
    </div>
    ${cfg.source === "level" && !prog.complete ? listMissingPanel(L, prog, "die Verben") : ""}`;
  bindListPrep(L);
  $("#cSrc").onclick = e => { const b = e.target.closest("button"); if (!b || b.disabled) return; cfg.source = b.dataset.v; renderConjHome(body); };
  $("#cMode").onclick = e => { const b = e.target.closest("button"); if (!b) return; cfg.mode = b.dataset.m; renderConjHome(body); };
  $("#cTen").onclick = e => { const b = e.target.closest("button"); if (!b) return; const t = b.dataset.t;
    cfg.tenses = cfg.tenses.includes(t) ? cfg.tenses.filter(x => x !== t) : [...cfg.tenses, t]; b.setAttribute("aria-pressed", cfg.tenses.includes(t)); };
  $("#cGo").onclick = async () => {
    if (!cfg.tenses.length) return toast("Wähle mindestens eine Zeit.");
    const st = $("#cStat"), btn = $("#cGo");
    const lemmas = srcLemmas(cfg.source);
    if (!lemmas.length) return toast(cfg.source === "level" ? `Lade zuerst die Wortliste ${L}.` : "Noch keine Verben.");
    const need = cfg.mode === "table" ? 4 : 6;
    const hasAll = (b, l) => b.has(l) && cfg.tenses.some(t => b.get(l).tables[t]);
    let picked = shuffle(lemmas).slice(0, need);
    if (online) {
      const missing = picked.filter(l => !bank.has(l) || cfg.tenses.some(t => !bank.get(l).tables[t]));
      if (missing.length) { btn.disabled = true; try { await fetchTables(missing, m => { st.innerHTML = spinner(m); }); } catch (e) { st.textContent = e.message; } btn.disabled = false; st.textContent = ""; }
    }
    const fresh = await loadVerbBank();
    picked = picked.filter(l => hasAll(fresh, l));
    if (picked.length < need) picked = [...picked, ...shuffle(lemmas.filter(l => hasAll(fresh, l) && !picked.includes(l)))].slice(0, need);
    if (!picked.length) { st.textContent = online ? "Es konnten keine Tabellen erstellt werden. Versuche es gleich noch einmal." : "Für diese Verben sind noch keine Tabellen auf dem iPad. Geh einmal online oder wähle Alle."; return; }
    const trText = l => trMap.get(l) || trOf((fresh.get(l) || {}).tr) || "";
    if (cfg.mode === "table") {
      const items = [];
      for (const l of picked) { const ts = shuffle(cfg.tenses.filter(t => fresh.get(l).tables[t])); if (ts.length) items.push({lemma: l, trText: trText(l), tense: ts[0], forms: fresh.get(l).tables[ts[0]]}); }
      startEx({kind: "table", title: "Ganze Tabellen", items});
    } else {
      const pool = [];
      for (const l of picked) for (const t of cfg.tenses) if (fresh.get(l).tables[t]) for (let p = 0; p < 6; p++) pool.push({lemma: l, trText: trText(l), tense: t, p, answer: fresh.get(l).tables[t][p]});
      const per = {}, items = [];
      for (const it of shuffle(pool)) { if ((per[it.lemma] || 0) >= 2) continue; per[it.lemma] = (per[it.lemma] || 0) + 1; items.push(it); if (items.length === 10) break; }
      for (const it of shuffle(pool)) { if (items.length >= 10) break; if (!items.includes(it)) items.push(it); }
      startEx({kind: "conj", title: "Verben", items});
    }
  };
}

/* ----- vocabulary ----- */
async function renderVocabHome(body) {

  const clozeLevel = deck.filter(w => w.ex && w.form), clozeLog = clozeFromLog(words.filter(w => w.refs && w.refs.length));

      <div class="ptrack"><div style="width:${vst.known / vst.total * 100}%"></div></div>
      <p class="small muted" style="margin:8px 0 0">Wörter, die du aus der Liste kennst, zählen für deinen Fortschritt und erscheinen in deiner Sammlung, auch bevor du sie im Heft benutzt.</p></div>`;
  if (!deck.length && src === "log") html += `<div class="empty-state"><p>Deine eigenen Wörter erscheinen hier, sobald du eine Heftseite korrigiert und in der Sammlung gespeichert hast.</p></div>`;
  if (deck.length) html += `
    <div class="panel"><h3>Satz ergänzen</h3>
      <p class="small">Lies den Satz und schreib das fehlende Wort in der richtigen Form. ${src === "level" ? `Die Sätze stammen aus der ${L}-Liste.` : "Die Sätze sind deine eigenen, korrigierten Heftsätze."}</p>
      <button class="btn primary" id="vCloze" ${clozeN >= 3 ? "" : "disabled"}>Starten (10 Sätze)</button> ${clozeN >= 3 ? "" : '<span class="small muted">Noch nicht genug Sätze.</span>'}</div>
    <div class="panel"><h3>Karteikarten</h3>
      <p class="small">Du siehst die Bedeutung, erinnerst dich an das französische Wort und deckst dann auf. Bekannte Wörter kommen immer seltener wieder.${src === "level" ? " Kennst du ein neues Wort, kommt es in deine Sammlung." : ""}</p>
      <div class="card-stats"><div><span class="pnum" style="font-size:30px">${fmtN(fresh.length)}</span><span class="small muted">${fresh.length === 1 ? "neues Wort" : "neue Wörter"} zu lernen</span></div>
        <div><span class="pnum" style="font-size:30px">${fmtN(due.length)}</span><span class="small muted">heute zu wiederholen</span></div></div>
      <p class="small muted" style="margin:4px 0 10px">${roundText(due.length, fresh.length)}</p>
      <div class="row"><button class="btn primary" id="vCards" ${due.length + fresh.length ? "" : "disabled"}>${due.length + fresh.length ? "Starten" : "Für heute fertig ✓"}</button>
      ${src === "log" && words.some(w => !w.own) ? `<button class="btn" id="vCorr">Wörter aus Korrekturen</button>` : ""}</div></div>
    <div class="panel"><h3>un ou une ?</h3>
      <p class="small">10 Nomen: maskulin oder feminin? So schnell du kannst.</p>

      : shuffle(clozeLog).slice(0, 10);

// A round: every review that's due (up to 20), then new words to fill up to 10 new per round
function roundSize(due, fresh) { const r = Math.min(20, due), n = Math.min(fresh, 10, Math.max(0, 20 - r)); return {r, n}; }
function roundText(due, fresh) {
  const {r, n} = roundSize(due, fresh);
  if (!r && !n) return "Heute gibt es nichts zu wiederholen. Komm morgen wieder.";
  return `Diese Runde: ${[r ? `${r} ${r > 1 ? "Wiederholungen" : "Wiederholung"}` : "", n ? `${n} ${n > 1 ? "neue Wörter" : "neues Wort"}` : ""].filter(Boolean).join(" + ")}. Jede Karte kommt einmal; was du noch nicht weißt, kommt morgen wieder.`;
}

/* ----- exercise runner ----- */
function startEx(ex) { state.ex = {...ex, i: 0, right: 0, n: 0, xp: 0, added: 0, missed: []}; if (state.view !== "exercises") { state.view = "exercises"; render(); } else renderExItem(); }
function exHeader(ex) {
  return `<div class="row"><span class="muted">${esc(ex.title)} · ${Math.min(ex.i + 1, ex.items.length)} von ${ex.items.length}</span><span class="spacer"></span><span class="xp-pill">+${ex.xp} XP</span><button class="btn slim" id="exStop">Stopp</button></div>
    <div class="progress"><div style="width:${ex.i / ex.items.length * 100}%"></div></div>`;
}
function bindStop() { $("#exStop").onclick = () => { const ex = state.ex; state.ex = null; if (ex.n > 0) finishEx(ex); else renderExercises(); }; }
function nextEx() { const ex = state.ex; if (!ex) return; ex.i++; if (ex.i >= ex.items.length) { state.ex = null; finishEx(ex); } else renderExItem(); }
function award(ex, counter, ok, xp) { ex.n++; if (ok) ex.right++; ex.xp += xp; addActivity(counter, 1, xp, ok); }
async function learned(ex, it) { if (it.fromLevel && await markKnown({...it, translation: it.tr || it.front})) ex.added++; }
const ansInput = (id, cls = "") => `<input type="text" id="${id}" class="${cls}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
function judge(val, answer) {
  const v = answerVariants(answer), ok = v.has(normAns(val));
  return {ok, almost: !ok && [...v].some(x => foldAns(x) === foldAns(val))};
}

function renderExItem() {

      inp.classList.add(ok ? "right" : "wrong");
      const full = `${pronFor(it.p, it.tense, it.answer)}${/['’]$/.test(pronFor(it.p, it.tense, it.answer)) ? "" : " "}${it.answer}`;
      $("#fb").innerHTML = `<p>${ok ? "<b>C’est juste !</b>" : almost ? `<b>Fast.</b> Achte auf die Akzente: <b>${esc(full)}</b>` : `<b>Nicht ganz.</b> Richtig ist <b>${esc(full)}</b>`}</p>`;

    };
    $("#go").onclick = check;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  } else if (ex.kind === "table") {

      <div class="ex-card"><div class="small muted">${esc(it.tense)}</div>
        <div class="ex-big">${esc(it.lemma)}</div>${it.trText ? `<div class="muted">${esc(it.trText)}</div>` : ""}
        <div class="ctable">${PERSONS.map((p, k) => `<label class="pron" for="t${k}">${esc(pronFor(k, it.tense, it.forms[k]))}</label>${ansInput("t" + k)}<span class="fixline" id="f${k}"></span>`).join("")}</div></div>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="go">Tabelle prüfen</button></div><div id="fb" style="margin-top:12px"></div></div>`;
    bindStop();
    const inputs = PERSONS.map((_, k) => $("#t" + k)); setTimeout(() => inputs[0].focus(), 50);
    let checked = false;
    const check = () => {
      if (checked) return nextEx();

      $("#go").textContent = nextLabel();
    };
    $("#go").onclick = check;
    inputs.forEach((x, k) => x.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (k < 5 && !checked) inputs[k + 1].focus(); else check(); } }));

        <div class="small muted" style="margin-top:10px">Gesuchtes Wort: <b>${esc(it.hint || "")}</b> <button class="btn slim" id="hint">Grundform zeigen</button></div>
        <div class="conj-line">${ansInput("ans")}</div></div>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="go">Prüfen</button></div><div id="fb" style="margin-top:12px"></div></div>`;

    let checked = false;
    const check = async () => {

      checked = true; inp.disabled = true;
      const {ok, almost} = judge(inp.value, it.form);

      inp.classList.add(ok ? "right" : "wrong");

      $("#fb").innerHTML = `<p>${ok ? "<b>C’est juste !</b>" : almost ? "<b>Fast.</b> Achte auf die Akzente." : "<b>Nicht ganz.</b>"} ${esc(it.sentence)}</p>`;
      $("#go").textContent = nextLabel();
    };

    bindStop();
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i), ok = i === it.answer;

      $("#fb").innerHTML = `<p>${ok ? "<b>C’est juste !</b> " : "<b>Nicht ganz.</b> "}${esc(it.explain || "")}</p><button class="btn primary" id="go">${nextLabel()}</button>`;
      $("#go").onclick = nextEx;
    });
  } else if (ex.kind === "card") {
    $("#main").innerHTML = `<div class="wrap">${exHeader(ex)}
      <div class="ex-card"><div class="small muted">${esc(it.pos || "")}${it.group === "noun" ? " · mit Artikel" : ""}${ex.practice ? " · Extra-Übung" : it.isNew ? ' · <span class="lv-mini">neu</span>' : ""}</div>
        <div class="ex-big">${esc(it.front)}</div>
        <div id="back" class="ex-back" hidden>
          <div class="ex-big">${artHTML(it.article, it.lemma)}${esc(it.lemma)}</div>
          ${artClass(it.article) ? `<div class="muted">${artClass(it.article) === "m" ? "maskulin · un" : "feminin · une"} ${esc(it.lemma)}${it.plural ? ` · Plural: les ${esc(it.plural)}` : ""}</div>` : ""}
          ${it.example ? `<div style="margin-top:8px">${esc(it.example)}</div>${it.exTr ? `<div class="tr" style="margin-top:0">${esc(it.exTr)}</div>` : ""}` : ""}</div></div>
      <div class="row" style="margin-top:14px" id="cardBtns"><button class="btn primary" id="show">Aufdecken</button></div></div>`;
    bindStop();
    $("#show").onclick = () => {
      $("#back").hidden = false;
      $("#cardBtns").innerHTML = `<button class="btn" id="no">Noch nicht</button><button class="btn primary" id="yes">Gewusst</button>`;
      const grade = async ok => {
        if (ex.practice) { ex.n++; if (ok) ex.right++; nextEx(); return; }   // practice round: no schedule change, no XP, not marked known
        const srs = (await dbGet("srs")) || {}, cur = srs[it.key] || {box: -1};
        const box = ok ? Math.min(5, cur.box + 1) : 0;
        srs[it.key] = {box, due: addDays(todayStr(), ok ? SRS_DAYS[box] : 1), seen: (cur.seen || 0) + 1};
        await dbSet("srs", srs);

        if (ok) await learned(ex, it); else ex.missed.push(it);
        nextEx();

    };
  } else if (ex.kind === "article") {
    $("#main").innerHTML = `<div class="wrap">${exHeader(ex)}
      <div class="ex-card"><div class="ex-big">___ ${esc(it.lemma)}</div><div class="muted">${esc(it.tr || "")}</div></div>
      <div class="art-btns">${[["m", "un"], ["f", "une"]].map(([g, a]) => `<button class="art-btn ${g}" data-a="${g}">${a}</button>`).join("")}</div><div id="fb" style="margin-top:12px;min-height:28px"></div></div>`;
    bindStop();
    document.querySelectorAll(".art-btn").forEach(b => b.onclick = () => {
      const ok = b.dataset.a === it.article;
      award(ex, "art", ok, ok ? 1 : 0);
      document.querySelectorAll(".art-btn").forEach(x => { x.disabled = true; if (x.dataset.a === it.article) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
      $("#fb").innerHTML = ok ? "<b>C’est juste !</b>" : `<b>${it.article === "m" ? "un" : "une"} ${esc(it.lemma)}</b>`;
      setTimeout(nextEx, ok ? 550 : 1300);
    });
  }
}
async function finishEx(ex) {
  if (ex.kind === "mc" && ex.setId && ex.i >= ex.items.length) {
    const sets = (await dbGet("gsets")) || []; const s = sets.find(x => x.id === ex.setId);
    if (s) { s.best = Math.max(s.best || 0, ex.right); await dbSet("gsets", sets); }
    addActivity("gramSets", 1, 5, true); ex.xp += 5;
  }
  const label = {conj: "Verbformen richtig", table: "Verbformen richtig", mc: "Fragen richtig", card: "Karten gewusst", article: "richtig", cloze: "Sätze richtig"}[ex.kind];

let actQueue = Promise.resolve();
const dayOf = t => t ? ds(new Date(t)) : "";
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let x = seed || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }
function dayRec(act, d) { return act[d] || (act[d] = {xp: 0, c: {}, q: {}}); }

// counter: what was practised; ok: was the answer right (counts toward "get N right" quests)
function addActivity(counter, n, xp, ok = true) {
  actQueue = actQueue.then(async () => {
    const act = (await dbGet("act")) || {}, a = dayRec(act, todayStr());
    if (counter) { a.c[counter + "_n"] = (a.c[counter + "_n"] || 0) + n; if (ok) a.c[counter] = (a.c[counter] || 0) + n; }
    a.xp += xp || 0;
    await dbSet("act", act);
  }).then(() => evaluateQuests()).catch(e => console.warn(e));
  return actQueue;
}

// Which words you wrote yourself, and the first day you did
function ownWordDates(logs) {
  const first = {}, today = new Set(), t = todayStr();
  for (const log of logs.slice().sort((a, b) => a.date.localeCompare(b.date))) for (const s of log.sentences || []) {
    const own = new Set(String(s.original || "").toLowerCase().split(/[^\p{L}]+/u).filter(Boolean));
    for (const w of s.words || []) {
      if (!w.lemma || !w.form || !own.has(String(w.form).toLowerCase())) continue;
      const key = String(w.lemma).trim().toLowerCase() + "|" + posKey(w.pos);
      if (!first[key]) first[key] = log.date;
      if (log.date === t) today.add(key);
    }
  }
  return {first, today};
}

async function todayQuests() {
  const d = todayStr(), act = (await dbGet("act")) || {}, a = dayRec(act, d);
  const logs = await loadLogs(), words = (await allWords(logs)).filter(w => w.translation);
  const ownKeys = new Set(words.filter(w => w.own).map(w => normLemma(w.lemma)));
  const lvl = listWords(await getLevelList(targetLevel()));
  const nouns = words.filter(w => posGroup(w.pos) === "noun" && artClass(w.article));
  const own = ownWordDates(logs), pi = state.pageIndex[d] || {};
  let changed = false;
  if (!a.plan) {
    const rnd = seeded(hashStr(d));
    const pool = ["check", "newwords", "conj", "conj", "gram"];
    if (words.length + lvl.length >= 5) pool.push("cards", "cards");
    if (nouns.length >= 4 || lvl.filter(w => w.article).length >= 4) pool.push("art");
    if (lvl.some(w => w.ex)) pool.push("cloze", "cloze");
    if (!state.settings.key) for (const k of ["check", "newwords", "gram"]) while (pool.includes(k)) pool.splice(pool.indexOf(k), 1);
    const picks = [];
    while (picks.length < 2 && pool.length) { const k = pool.splice(Math.floor(rnd() * pool.length), 1)[0]; if (!picks.includes(k)) picks.push(k); }
    a.plan = ["write", ...picks];
    // word of the day: a word you met in a correction but never wrote yourself; otherwise a core verb you haven't used
    const lvlNew = lvl.filter(w => !ownKeys.has(normLemma(w.lemma))).map(w => ({key: w.key, lemma: w.lemma, article: w.article, translation: w.tr}));
    const cands = lvlNew.length ? lvlNew : words.filter(w => !w.own).map(w => ({key: w.key, lemma: w.lemma, article: w.article, translation: w.translation}));
    const usedLemmas = new Set(Object.keys(own.first).map(k => k.split("|")[0]));
    const coreLeft = CORE_VERBS.filter(v => !usedLemmas.has(v[0])).map(v => ({key: v[0] + "|verb", lemma: v[0], translation: state.settings.lang === "English" ? v[2] : v[1]}));
    const list = cands.length ? cands : coreLeft;
    if (list.length && state.settings.key) { a.wotd = list[Math.floor(rnd() * list.length)]; a.plan.push("wotd"); }
    changed = true;
  }
  if (changed) await dbSet("act", act);
  const newToday = Object.values(own.first).filter(x => x === d).length;
  const checkedToday = pi.saved && dayOf(pi.savedAt) === d;
  const info = {
    write: {title: "Schreib eine Seite in dein Heft", target: 1, have: pi.thumb ? 1 : 0},
    check: {title: "Korrigiere die heutige Seite und speichere sie", target: 1, have: checkedToday ? 1 : 0},
    wotd: a.wotd ? {title: `Wort des Tages: Benutze „${artText(a.wotd.article, a.wotd.lemma)}${a.wotd.lemma}“ auf deiner heutigen Seite`, sub: (a.wotd.translation || "") + " · zählt, sobald die Seite korrigiert ist", target: 1, have: own.today.has(a.wotd.key) ? 1 : 0} : null,
    newwords: {title: "Benutze 3 Wörter, die du noch nie geschrieben hast", sub: "zählt, sobald die Seite korrigiert ist", target: 3, have: newToday},
    cards: {title: "Wiederhole 15 Karteikarten", target: 15, have: a.c.cards_n || 0},
    art: {title: "12-mal das richtige Genus (un oder une)", target: 12, have: a.c.art || 0},
    conj: {title: "10 Verbformen richtig", target: 10, have: a.c.conj || 0},
    gram: {title: "Eine Grammatikübung abschließen", target: 1, have: a.c.gramSets || 0},
    cloze: {title: "8 Sätze richtig ergänzen", target: 8, have: a.c.cloze || 0}
  };
  return {act, a, quests: a.plan.filter(k => info[k]).map(k => ({id: k, ...QUESTS[k], ...info[k], done: info[k].have >= info[k].target}))};
}

let evaluating = false;
async function evaluateQuests() {
  if (evaluating) return; evaluating = true;
  try {
    const {act, a, quests} = await todayQuests();
    const goal = state.settings.goal || 50;
    for (const q of quests) if (q.done && !a.q[q.id]) { a.q[q.id] = true; a.xp += q.xp; toast(`Aufgabe geschafft: ${q.title.split(":")[0]}  +${q.xp} XP`, 3200); await sleep(400); }
    if (a.xp >= goal && !a.goalHit) { a.goalHit = true; toast(`🔥 Tagesziel erreicht! Serie: ${streakInfo(act).current} ${streakInfo(act).current > 1 ? "Tage" : "Tag"}`, 3600); }
    await dbSet("act", act);
  } catch (e) { console.warn(e); }
  evaluating = false;
}
function hitDay(act, d) { const a = act[d]; return !!(a && (a.goalHit || a.xp >= (state.settings.goal || 50))); }
function streakInfo(act) {
  let d = todayStr(); if (!hitDay(act, d)) d = addDays(d, -1);
  let current = 0; while (hitDay(act, d)) { current++; d = addDays(d, -1); }
  const days = Object.keys(act).filter(k => hitDay(act, k)).sort(); let best = 0, run = 0, prev = null;
  for (const k of days) { run = prev && addDays(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return {current, best: Math.max(best, current)};
}

async function doBackup() {
  try {
    const data = await dbAll();
    const json = JSON.stringify({app: "mon-cahier", version: 1, exported: new Date().toISOString(), data});
    const name = `mon-cahier-sicherung-${todayStr()}.json`;
    const file = new File([json], name, {type: "application/json"});
    let done = false;
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: "Sicherung Mon cahier"}); done = true; }
      catch (e) { if (e.name === "AbortError") return false; }
    }
    if (!done) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    state.lastBackup = Date.now(); await dbSet("lastBackup", state.lastBackup);
    return true;
  } catch (e) { toast("Sicherung fehlgeschlagen: " + e.message, 5000); return false; }
}
function renderSettingsBackupLine() {
  const el = $("#bkLine"); if (!el) return;
  el.textContent = state.lastBackup ? `Letzte Sicherung: ${new Intl.DateTimeFormat("de-DE", {day: "numeric", month: "long", year: "numeric"}).format(new Date(state.lastBackup))}.` : "Noch keine Sicherung gespeichert.";
}

async function loadState() {
  state.settings = {...DEFAULT_SETTINGS, ...((await dbGet("settings")) || {})};
  state.pageIndex = (await dbGet("pageIndex")) || {};
  state.lastBackup = (await dbGet("lastBackup")) || null;
}
(async function init() {
  try { await loadState(); }
  catch (e) { document.body.innerHTML = `<div class="wrap"><h1>Mon cahier kann seinen Speicher nicht öffnen</h1><p>${esc(e.message)}</p><p>Im privaten Modus von Safari ist der Speicher gesperrt. Öffne die Seite in einem normalen Tab.</p></div>`; return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
})();

</script>
</body>
</html>
